version: '3.8'
services:
  db:
    image: ghcr.io/reddb-io/reddb:latest
    container_name: recommendation-db
    restart: always
    ports:
      - "3050:3050"
      - "8080:8080"
    environment:
      REDDB_TOPOLOGY: standalone
      REDDB_STORAGE_PRESET: embedded
    volumes:
      - reddb-data:/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command:
      - server
      - --path=/data/data.rdb
      - --http-bind=0.0.0.0:8080
    healthcheck:
      test: ["CMD", "red", "doctor", "--bind", "127.0.0.1:8080"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./Recommendations
      dockerfile: Dockerfile.api
    container_name: recommendation-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=User=sysdba;password=070507;database=db/3050:/data/data.rdb;dialect=3;charset=UTF8;
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./Recommendations/appsettings.json:/app/appsettings.json

  vue-dev:
    build:
      context: ./recommendations
      dockerfile: Dockerfile.vue.dev
    container_name: recommendation-vue-dev
    ports:
      - "5173:5173"
    volumes:
      - ./recommendations/src:/app/src
      - ./recommendations/public:/app/public
      - ./recommendations/index.html:/app/index.html
      - ./recommendations/vite.config.js:/app/vite.config.js
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api

volumes:
  reddb-data:
